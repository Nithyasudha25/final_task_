<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="final.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
    </header>

    <!-- Date and Time -->
    <div class="date-time">
        <h3 id="date"></h3>
        <h3 id="time"></h3>
    </div>

    <div class="container">

        <!-- Search -->
        <section class="search-section">

            <h2>Search Employee</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Enter employee name"
            >

            <button id="searchBtn">Search</button>

        </section>


        <!-- Department Filter -->
        <section class="filter-section">

            <h2>Department Filter</h2>

            <button class="filter-btn" data-department="All">
                All Employees
            </button>

            <button class="filter-btn" data-department="IT">
                IT
            </button>

            <button class="filter-btn" data-department="HR">
                HR
            </button>

            <button class="filter-btn" data-department="Finance">
                Finance
            </button>

            <button class="filter-btn" data-department="Marketing">
                Marketing
            </button>

        </section>


        <!-- Sort -->
        <section class="sort-section">

            <h2>Sort Employees</h2>

            <button id="sortName">
                Sort by Name
            </button>

            <button id="sortAge">
                Sort by Age
            </button>

            <button id="sortSalary">
                Sort by Salary
            </button>

        </section>


        <!-- Message -->
        <div id="message">
            Loading employees...
        </div>


        <!-- Employee Count -->
        <div class="employee-count">

            Total Employees:
            <span id="employeeCount">0</span>

        </div>


        <!-- Employee Cards -->
        <div
            id="employeeContainer"
            class="employee-container">
        </div>


        <!-- Salary Dashboard -->
        <section class="salary-section">

            <h2>Salary Dashboard</h2>

            <div class="salary-container">

                <div class="salary-box">
                    <h3>Total Employees</h3>
                    <p id="salaryEmployeeCount">0</p>
                </div>

                <div class="salary-box">
                    <h3>Total Salary</h3>
                    <p id="totalSalary">₹0</p>
                </div>

                <div class="salary-box">
                    <h3>Average Salary</h3>
                    <p id="averageSalary">₹0</p>
                </div>

            </div>


            <div class="highest">

                <h3> Highest Paid Employee</h3>

                <p id="highestEmployee">
                    No employee available
                </p>

            </div>

        </section>


        <!-- Add Employee -->
        <section class="add-section">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter name"
                    >

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Salary</label>

                    <input
                        type="number"
                        id="salary"
                        placeholder="Enter salary"
                    >

                </div>


                <button type="submit" class="add-btn">
                    Add Employee
                </button>

            </form>


            <div id="errorMessage"></div>

        </section>

    </div>


    <script src="final.js"></script>

</body>

</html>
